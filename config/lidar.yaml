# PS26053 LiDAR Ingestion & Preprocessing Parameters
sensor:
  type: "Velodyne_HDL64E"
  frame_id: "lidar_link"
  points_per_frame_approx: 120000
  rate_hz: 10.0

roi_crop:
  enabled: true
  x_min: -50.0  # meters
  x_max: 50.0
  y_min: -50.0
  y_max: 50.0
  z_min: -4.0
  z_max: 6.0

# NOTE (H3): an intensity/noise-filter section used to live here, but no such
# filter exists in the code. It was removed rather than left to imply behavior
# the pipeline does not have. Re-add it only together with an implementation
# wired in MappingPipeline::processFrame.

voxel_downsample:
  enabled: true
  leaf_size: 0.10  # 10 cm input voxel filter before inference
