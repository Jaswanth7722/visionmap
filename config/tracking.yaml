# PS26053 Kalman Tracking & Association Configuration
tracking:
  enabled: true
  state_dim: 4      # [x, y, vx, vy]
  measurement_dim: 2 # [x, y]
  
association:
  max_euclidean_distance: 2.5 # meters (greedy nearest-centroid gate)
  max_missed_frames: 5
  min_hits_to_confirm: 3

# NOTE (H3): gating_threshold_chi2 and max_cluster_size used to be listed
# here. Association is greedy-Euclidean (no chi-squared test exists) and
# clustering has no upper size cap, so both keys were removed rather than
# left to imply unimplemented behavior.

kalman_filter:
  process_noise_pos: 0.1   # variance
  process_noise_vel: 0.5
  measurement_noise_pos: 0.2
  time_step_dt: 0.1        # 10 Hz nominal

cluster_extraction:
  min_cluster_size: 15
  cluster_tolerance: 0.65  # meters (3D Euclidean link radius)
