# PS26053 System & Pipeline Configuration
system:
  project_name: "PS26053_Adaptive_2.5D_Lidar_Mapping"
  version: "1.0.0"
  target_fps: 20.0
  log_level: "INFO" # DEBUG, INFO, WARN, ERROR
  num_threads: 4

paths:
  data_dir: "data"
  raw_scans: "data/raw"
  sequences_dir: "data/sequences"
  model_onnx: "models/onnx/pointnet2_semseg.onnx"
  output_maps: "results/maps"
  benchmark_results: "results/benchmarks"

visualization:
  live_viewer: true
  open3d_window_width: 1280
  open3d_window_height: 720
  color_scheme:
    # Locked architecture palette (M1): emerald / cyan / amber.
    terrain: [0.063, 0.725, 0.506]
    static_obstacle: [0.0, 0.953, 1.0]
    dynamic_object: [0.961, 0.620, 0.043]

# NOTE (H3): paths.* below document the repository layout convention; the C++
# apps take explicit argv paths and do not load this file. Treat values here
# as documentation, not live configuration.
