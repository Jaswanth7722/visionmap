# PS26053 PointNet++ ONNX Deployment Parameters
model:
  name: "PointNet2_SemSeg"
  architecture: "PointNet++ (Set Abstraction + Feature Propagation)"
  format: "ONNX"
  path: "models/onnx/pointnet2_semseg.onnx"
  metadata_path: "models/metadata/model_metadata.json"
  
inference:
  subsample_points: 4096
  batch_size: 1
  input_channels: 4  # (x, y, z, intensity)
  num_classes: 3     # 0: terrain, 1: static obstacle, 2: dynamic obstacle
  onnx_intra_op_threads: 4
  onnx_inter_op_threads: 1
  execution_provider: "CPUExecutionProvider"
  warmup_runs: 5

classes:
  0: "terrain"
  1: "static_obstacle"
  2: "dynamic_obstacle"
