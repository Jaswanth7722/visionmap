# PS26053 Adaptive Variable Resolution Configuration
# Dual-Level Spatial Adaptation Spec

level1_distance_bands:
  - max_range: 10.0   # 0 to 10 m
    cell_size: 0.05   # 5 cm
    name: "near_critical"
  - max_range: 30.0   # 10 to 30 m
    cell_size: 0.15   # 15 cm
    name: "mid_range"
  - max_range: 60.0   # 30 to 60 m
    cell_size: 0.30   # 30 cm
    name: "far_range"
  - max_range: 100.0  # 60 to 100 m
    cell_size: 0.50   # 50 cm
    name: "horizon"

level2_local_refinement:
  enabled: true
  max_subdivision_depth: 2   # Each subdivision splits cell into 4 quadrants (Quadtree)
  triggers:
    dynamic_object_motion:
      enabled: true
      min_velocity_threshold: 0.25 # m/s
      target_resolution: 0.05     # Refine down to 5 cm around moving objects
    elevation_gradient:
      enabled: true
      curb_height_threshold: 0.12 # meters (detects curbs and steps)

# NOTE (H3): a semantic_boundary trigger (min_entropy_threshold) used to be
# listed here, but the code has no entropy/uncertainty trigger — low
# confidence feeds the importance score instead. Removed rather than left to
# imply an unimplemented code path.

world_grid_extent:
  x_min: -60.0
  x_max: 60.0
  y_min: -60.0
  y_max: 60.0
  base_tile_size: 1.0 # 1m master tiles containing variable resolution cells

# NOTE (M9): the grid extent intentionally exceeds the lidar.yaml ROI box
# (+/-50 m): the ROI corners reach ~70 m from the sensor, and points outside
# the grid bounds are dropped by Grid25D, so the margin is load-bearing.
